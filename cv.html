<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio CV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* Layout: editor de dos paneles — formulario a la izquierda, escenario animado con la hoja A4 a la derecha; en móvil, pestañas. */
:root {
  /* Mismo sistema visual que el portafolio: claro, tinta casi negra y un solo acento naranja */
  --bg: #fdfcfa;
  --panel: #ffffff;
  --panel-2: #f7f3ee;
  --line: #ece7df;
  --fg: #15130f;
  --muted: #5f5a52;
  --accent: #f26b1d;
  --accent-ink: #ffffff;
  --sheet: #ffffff;
  --sheet-fg: #15130f;
  --sheet-muted: #5f5a52;
  --danger: #d6453b;
  --f-display: "Sora", "Helvetica Neue", Arial, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 14px; line-height: 1.5;
  overflow: hidden;
}
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #b14a0c; outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; height: 100%; }

/* ---------- Editor ---------- */
.editor {
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-width: 0; height: 100%;
}
.ed-head {
  padding-block: 18px 14px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
  border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 12px;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: -.01em; }
.brand h1 span { color: var(--accent); }
.brand small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px;
  padding: 7px 11px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  transition: border-color .2s, background .2s, transform .15s var(--ease);
}
.btn:hover { border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: #c2540f; color: var(--accent-ink); border-color: #c2540f; }
.btn.ghost { background: transparent; }
.btn.danger:hover { border-color: var(--danger); color: var(--danger); }

.ed-body {
  overflow-y: auto; flex: 1;
  padding-block: 8px 40px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: 20px;
}
.notice {
  margin: 12px 0 4px; padding: 10px 12px; border-radius: 10px;
  background: color-mix(in oklab, var(--accent) 12%, transparent);
  border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent);
  font-size: 12.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between;
}
details.sec { border-bottom: 1px solid var(--line); }
details.sec > summary {
  list-style: none; cursor: pointer; padding: 16px 0;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--f-mono); font-size: 11.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
}
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary::after { content: "+"; font-size: 16px; transition: transform .25s var(--ease); }
details.sec[open] > summary { color: var(--fg); }
details.sec[open] > summary::after { transform: rotate(45deg); }
.sec-body { display: flex; flex-direction: column; gap: 12px; padding-bottom: 20px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.field input, .field textarea, .field select {
  width: 100%; background: var(--bg); border: 1px solid #8f887d; border-radius: 8px;
  padding: 9px 10px; font-size: 13.5px; transition: border-color .2s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
.field textarea { resize: vertical; min-height: 78px; line-height: 1.45; }
.item {
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px; display: flex; flex-direction: column; gap: 10px;
  animation: pop .35s var(--ease);
}
.item-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.item-head strong { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini { display: flex; gap: 4px; flex-shrink: 0; }
.mini button {
  width: 28px; height: 28px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg);
  cursor: pointer; font-size: 13px; line-height: 1; display: grid; place-items: center;
}
.mini button:hover { border-color: var(--accent); }
.mini button.del:hover { border-color: var(--danger); color: var(--danger); }
.add { border-style: dashed; background: transparent; width: 100%; padding: 10px; }
.photo-row { display: flex; gap: 12px; align-items: center; }
.photo-thumb {
  width: 56px; height: 56px; border-radius: 50%; background: var(--bg) center/cover; border: 1px solid var(--line);
  display: grid; place-items: center; font-family: var(--f-display); color: var(--muted); flex-shrink: 0;
}
.range-wrap { display: flex; align-items: center; gap: 10px; }
.range-wrap input[type=range] { flex: 1; accent-color: var(--accent); padding: 0; border: 0; background: none; }
.range-wrap output { font-family: var(--f-mono); font-size: 12px; width: 36px; text-align: right; color: var(--muted); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch {
  width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer;
  background: var(--c); transition: transform .2s var(--ease);
}
.swatch[aria-pressed="true"] { border-color: var(--fg); transform: scale(1.1); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { flex: 1; padding: 8px; border: 0; background: transparent; cursor: pointer; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--fg); }

/* ---------- Stage ---------- */
.stage { position: relative; overflow: auto; min-width: 0; height: 100%; }
#ambient { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.stage-inner {
  position: relative; z-index: 1; min-height: 100%;
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  padding-block: 28px 60px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.stage-bar {
  width: 100%; max-width: 820px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;
  font-family: var(--f-mono); font-size: 11px; color: var(--muted); letter-spacing: .06em;
}
.stage-bar .btns { display: flex; gap: 6px; }

.sheet {
  width: 100%; max-width: 820px; aspect-ratio: 210 / 297; min-height: fit-content;
  background: var(--sheet); color: var(--sheet-fg);
  border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 30px 70px -40px rgba(21,19,15,.35);
  position: relative; overflow: hidden;
  --cv: var(--accent);
}
.sheet::before {
  content: ""; position: absolute; top: -30%; right: -20%; width: 70%; aspect-ratio: 1;
  background: radial-gradient(circle, color-mix(in oklab, var(--cv) 9%, transparent), transparent 65%);
  pointer-events: none;
}
.cv { position: relative; padding: clamp(24px, 5.5%, 52px); display: flex; flex-direction: column; gap: 30px; }
.cv-head { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: center; }
.cv-photo {
  width: 112px; height: 112px; border-radius: 50%; background: #fff1e7 center/cover;
  box-shadow: 0 0 0 4px var(--sheet), 0 0 0 6px var(--cv);
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 34px; color: var(--cv);
}
.cv-photo.hidden-photo { display: none; }
.cv-head.no-photo { grid-template-columns: 1fr; }
.cv-name {
  margin: 0; font-family: var(--f-display); font-weight: 700;
  font-size: clamp(28px, 5.4vw, 52px); line-height: 1; letter-spacing: -.045em; text-wrap: balance;
}
.cv-name .ch { display: inline-block; white-space: pre; }
.cv-role {
  margin: 10px 0 0; font-weight: 600; font-size: 16px; color: var(--sheet-muted);
}
.cv-contact { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 14px; font-size: 12.5px; color: var(--sheet-muted); }
.cv-contact span { display: inline-flex; gap: 6px; align-items: center; overflow-wrap: anywhere; }
.cv-contact i { font-style: normal; font-size: 10.5px; font-weight: 700; color: var(--cv); letter-spacing: .08em; }

.cv-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 36px; }
.cv-main, .cv-side { display: flex; flex-direction: column; gap: 28px; min-width: 0; }
.cv-sec h3 {
  margin: 0 0 16px; font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -.02em;
  color: var(--sheet-fg); display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
}
.cv-sec h3::after { content: ""; width: 30px; height: 3px; border-radius: 3px; background: var(--cv); }
.cv-summary { margin: 0; font-size: 14px; line-height: 1.65; color: var(--sheet-fg); max-width: 62ch; }

.timeline { position: relative; display: flex; flex-direction: column; gap: 20px; padding-left: 22px; }
.timeline::before {
  content: ""; position: absolute; left: 4px; top: 6px; bottom: 6px; width: 1px;
  background: linear-gradient(var(--cv), color-mix(in oklab, var(--cv) 10%, transparent));
  transform-origin: top;
}
.tl-item { position: relative; }
.tl-item::before {
  content: ""; position: absolute; left: -22px; top: 6px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--sheet); border: 2px solid var(--cv);
}
.tl-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.tl-title { font-weight: 700; font-size: 14.5px; }
.tl-org { color: var(--cv); font-weight: 600; font-size: 13px; }
.tl-date { font-size: 12px; font-weight: 700; color: var(--cv); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl-desc { margin: 6px 0 0; color: var(--sheet-muted); font-size: 13px; line-height: 1.55; white-space: pre-line; }

.tl-list { margin: 8px 0 0; padding-left: 16px; display: flex; flex-direction: column; gap: 5px; color: var(--sheet-muted); font-size: 12.8px; line-height: 1.5; }
.tl-list li::marker { color: var(--cv); }
.comp { display: flex; flex-direction: column; gap: 14px; }
.comp-title { font-size: 12.5px; font-weight: 700; margin-bottom: 7px; }
.chips span { font-size: 11.5px; }
.skills { display: flex; flex-direction: column; gap: 12px; }
.skill-top { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; gap: 8px; }
.skill-top span:last-child { font-family: var(--f-mono); font-size: 11px; color: var(--sheet-muted); font-variant-numeric: tabular-nums; }
.bar { height: 5px; border-radius: 3px; background: color-mix(in oklab, var(--sheet-fg) 9%, transparent); margin-top: 6px; overflow: hidden; }
.bar > b { display: block; height: 100%; border-radius: 3px; background: var(--cv); transform-origin: left; }

.langs { display: flex; flex-direction: column; gap: 10px; }
.lang { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; }
.cefr { display: flex; gap: 3px; }
.cefr span {
  font-family: var(--f-mono); font-size: 9px; font-weight: 500; width: 22px; text-align: center; padding: 2px 0; border-radius: 4px;
  color: var(--sheet-muted); background: color-mix(in oklab, var(--sheet-fg) 6%, transparent);
}
.cefr span.on { background: var(--cv); color: var(--accent-ink); }

.edu { display: flex; flex-direction: column; gap: 14px; }
.edu-item .tl-title { font-size: 13.5px; }
.edu-item .tl-org { font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-size: 12px; padding: 4px 10px; border-radius: 8px; background: #fff1e7; color: var(--sheet-fg); font-weight: 500; }
.empty { color: var(--sheet-muted); font-size: 12.5px; font-style: italic; }

/* Layout variant: una columna */
.sheet[data-layout="single"] .cv-grid { grid-template-columns: 1fr; }

/* Vista para compartir (#cv): solo la hoja de vida */
.share-logo { display: none; font-family: var(--f-display); font-weight: 800; font-size: 22px; letter-spacing: -.06em; color: var(--fg); text-decoration: none; align-items: baseline; gap: 10px; }
.share-logo b { color: var(--accent); }
.share-logo span { font-family: var(--f-body); font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.app[data-share] { display: block; height: auto; }
.app[data-share] .editor, .app[data-share] .tabs, .app[data-share] .label-edit, .app[data-share] #btn-print { display: none !important; }
.app[data-share] .stage { display: block !important; height: auto; overflow: visible; }
.app[data-share] .share-logo { display: inline-flex; }
body:has(.app[data-share]) { overflow: auto; }

/* mobile tabs */
.tabs { display: none; }
@media (max-width: 860px) {
  body { overflow: auto; }
  .app { display: block; height: auto; }
  .tabs {
    display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--panel); }
  .tabs button { flex: 1; padding: 13px; border: 0; background: none; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
  .editor, .stage { height: auto; border-right: 0; }
  .ed-body { overflow: visible; }
  .ed-head, .ed-body { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .app[data-view="edit"] .stage, .app[data-view="preview"] .editor { display: none; }
  .sheet { aspect-ratio: auto; }
  .cv-grid { grid-template-columns: 1fr; }
  .cv-head { grid-template-columns: 1fr; gap: 16px; }
  .cv-photo { width: 84px; height: 84px; font-size: 26px; }
}

/* JSON modal */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(21,19,15,.45); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(6px); }
.modal-card { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 12px; animation: pop .3s var(--ease); }
.modal-card h2 { margin: 0; font-family: var(--f-display); font-size: 16px; }
.modal-card p { margin: 0; color: var(--muted); font-size: 13px; }
.modal-card textarea { width: 100%; min-height: 260px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font-family: var(--f-mono); font-size: 12px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0;
  background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-weight: 600; font-size: 13px; z-index: 60;
  transition: opacity .25s, transform .35s var(--ease); pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}


/* ---------- Vista ATS (#cv): una columna, texto real, títulos estándar ---------- */
body.ats-mode { overflow: auto; height: auto; }
body.ats-mode .app, body.ats-mode .modal { display: none !important; }
.ats-view { min-height: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px;
  padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ats-bar { width: 100%; max-width: 210mm; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.ats-logo { display: inline-flex !important; }
.ats-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ats-controls .seg { background: var(--panel); }
.ats-controls .seg button { min-height: 36px; padding: 8px 12px; }
.ats-hint { width: 100%; margin: 0; font-size: 12.5px; color: var(--muted); }
.ats-doc { width: 100%; max-width: 210mm; background: #fff; color: #15130f; border: 1px solid var(--line); border-radius: 6px;
  box-shadow: 0 30px 70px -40px rgba(21,19,15,.35); padding: clamp(20px, 6vw, 16mm) clamp(18px, 6vw, 17mm); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.ats-doc h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(26px, 5vw, 32px); letter-spacing: -.035em; line-height: 1.1; }
.ats-doc .ats-role { margin: 6px 0 0; font-weight: 600; font-size: 15px; color: #5f5a52; }
.ats-doc .ats-contact { margin: 10px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; }
.ats-doc .ats-contact a { color: inherit; }
.ats-doc section { margin-top: 20px; }
.ats-doc h2 { margin: 0 0 10px; padding-bottom: 5px; border-bottom: 2px solid #f26b1d; font-family: var(--f-display); font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #15130f; }
.ats-doc h3 { margin: 0; font-size: 14.5px; font-weight: 700; }
.ats-doc p { margin: 0; }
.ats-doc ul { margin: 6px 0 0; padding-left: 18px; }
.ats-doc li { margin: 3px 0; }
.ats-doc li::marker { color: #f26b1d; }
.ats-doc .ats-job { margin-top: 14px; }
.ats-doc .ats-job:first-of-type { margin-top: 0; }
.ats-doc .ats-meta { margin-top: 2px; font-size: 12.5px; color: #5f5a52; }
.ats-doc .ats-meta b { color: #b14a0c; font-weight: 700; }
.ats-doc .ats-stack { margin-top: 4px; font-size: 12.5px; color: #5f5a52; }
.ats-doc .ats-plain { list-style: none; padding: 0; }
.ats-doc .ats-plain li { margin: 4px 0; }
.ats-doc .ats-cert-group { margin-top: 8px; font-size: 13.5px; font-weight: 700; }
.ats-doc .ats-earlier li { margin: 2px 0; }

@media print {
  body.ats-mode { background: #fff !important; }
  body.ats-mode .ats-bar { display: none !important; }
  body.ats-mode .ats-view { padding: 0; display: block; }
  body.ats-mode .ats-doc { max-width: none; border: 0; border-radius: 0; box-shadow: none; padding: 0; font-size: 10pt; line-height: 1.38;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body.ats-mode .ats-doc h1 { font-size: 20pt; }
  body.ats-mode .ats-doc .ats-role { font-size: 11pt; }
  body.ats-mode .ats-doc .ats-contact, body.ats-mode .ats-doc .ats-meta, body.ats-mode .ats-doc .ats-stack { font-size: 9pt; }
  body.ats-mode .ats-doc section { margin-top: 12pt; }
  body.ats-mode .ats-doc h2 { font-size: 10.5pt; margin-bottom: 6pt; break-after: avoid; page-break-after: avoid; }
  body.ats-mode .ats-doc h3 { font-size: 10.5pt; break-after: avoid; page-break-after: avoid; }
  body.ats-mode .ats-doc .ats-meta { break-after: avoid; page-break-after: avoid; }
  body.ats-mode .ats-doc .ats-job { margin-top: 9pt; }
  body.ats-mode .ats-doc li { break-inside: avoid; page-break-inside: avoid; }
  body.ats-mode .ats-doc p { orphans: 3; widows: 3; }
  body.ats-mode .ats-doc .ats-head, body.ats-mode .ats-doc .ats-keep { break-inside: avoid; page-break-inside: avoid; }
  body.ats-mode .ats-doc a { text-decoration: none; }
}

/* Impresión (solo funciona al abrir el archivo directamente en el navegador) */
@media print {
  @page { size: A4; margin: 0; }
  @page ats { size: A4; margin: 15mm 16mm 16mm; }
  body.ats-mode .ats-view { page: ats; }
  body { overflow: visible; background: #fff; }
  .editor, .tabs, .stage-bar, #ambient, .toast { display: none !important; }
  .app { display: block; }
  .stage, .stage-inner { overflow: visible; padding: 0; height: auto; }
  .sheet {
    --sheet: #ffffff; --sheet-fg: #14161d; --sheet-muted: #5b6072; --line: #dfe2ea;
    max-width: none; border: 0; border-radius: 0; box-shadow: none; aspect-ratio: auto;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .sheet::before { display: none; }
  .tl-item, .edu-item { break-inside: avoid; }
}
</style>

<script src="cv-data.js"></script>
<script>
(() => {
const KEY = "estudio-cv-armando-v4";
const ACCENTS = [
  ["Naranja", "#f26b1d"], ["Azul", "#2f5bea"], ["Verde", "#1f9d6b"], ["Vino", "#b0304f"], ["Grafito", "#3b3a36"]
];
const CEFR = ["A1", "A2", "B1", "B2", "C1", "C2"];

const D = window.CV_DATA;
const SAMPLE = {
  nombre: D.name,
  cargo: D.role.es,
  email: D.contact.email,
  telefono: D.contact.phone,
  ubicacion: D.contact.location,
  web: D.contact.linkedin,
  foto: D.contact.photo,
  resumen: D.profile.es,
  experiencia: D.experience.map(e => ({ cargo: e.role.es, empresa: e.org, inicio: e.start.es, fin: e.end.es,
    descripcion: e.bullets.map(b => b.es).join("\n") + (e.stack ? "\nStack: " + e.stack : "") })),
  educacion: D.education.map(x => ({ titulo: x.title.es, institucion: x.school, inicio: x.year.es, fin: "" })),
  habilidades: [],
  competencias: D.skills.map(g => ({ categoria: g.group.es, items: g.items.es.join(", ") })),
  certificaciones: D.certifications.flatMap(g => g.items.map(i => ({ nombre: i.name.es, detalle: [i.issuer, i.year].filter(Boolean).join(" · ") }))),
  herramientas: "",
  idiomas: [{ nombre: "Español", nivel: "Nativo" }, { nombre: "Inglés", nivel: "B1" }],
  acento: "#f26b1d",
  disposicion: "two"
};
const BLANK = {
  nombre: "", cargo: "", email: "", telefono: "", ubicacion: "", web: "", foto: "", resumen: "",
  experiencia: [{ cargo: "", empresa: "", inicio: "", fin: "", descripcion: "" }],
  educacion: [{ titulo: "", institucion: "", inicio: "", fin: "" }],
  habilidades: [], herramientas: "",
  competencias: [{ categoria: "", items: "" }],
  certificaciones: [{ nombre: "", detalle: "" }],
  idiomas: [{ nombre: "Español", nivel: "Nativo" }],
  acento: "#f26b1d", disposicion: "two"
};

const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = s => document.querySelector(s);

let data;
try { data = JSON.parse(localStorage.getItem(KEY)) || clone(SAMPLE); } catch { data = clone(SAMPLE); }
if (data.acento === "#8b95ff") data.acento = "#f26b1d";

let saveT;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(data)); $("#saved").textContent = "guardado ✓"; }
    catch { $("#saved").textContent = "sin guardar (foto muy grande)"; }
  }, 300);
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 1800); }

/* ---------------- Form ---------------- */
const LISTS = {
  experiencia: { label: "Experiencia", add: "Añadir experiencia", blank: { cargo: "", empresa: "", inicio: "", fin: "", descripcion: "" },
    title: it => it.cargo || "Nuevo puesto",
    fields: [["cargo", "Cargo"], ["empresa", "Empresa"], ["inicio", "Inicio", "half"], ["fin", "Fin", "half"], ["descripcion", "Logros y responsabilidades", "area"]] },
  educacion: { label: "Educación", add: "Añadir estudio", blank: { titulo: "", institucion: "", inicio: "", fin: "" },
    title: it => it.titulo || "Nuevo estudio",
    fields: [["titulo", "Título"], ["institucion", "Institución"], ["inicio", "Inicio", "half"], ["fin", "Fin", "half"]] },
  competencias: { label: "Competencias", add: "Añadir grupo", blank: { categoria: "", items: "" },
    title: it => it.categoria || "Nuevo grupo",
    fields: [["categoria", "Grupo (ej. Producto)"], ["items", "Elementos separados por comas", "area"]] },
  certificaciones: { label: "Certificaciones", add: "Añadir certificación", blank: { nombre: "", detalle: "" },
    title: it => it.nombre || "Nueva certificación",
    fields: [["nombre", "Certificación"], ["detalle", "Emisor · año"]] },
  habilidades: { label: "Habilidades con nivel (opcional)", add: "Añadir habilidad", blank: { nombre: "", nivel: 70 },
    title: it => it.nombre || "Nueva habilidad",
    fields: [["nombre", "Habilidad"], ["nivel", "Dominio", "range"]] },
  idiomas: { label: "Idiomas", add: "Añadir idioma", blank: { nombre: "", nivel: "B1" },
    title: it => it.nombre || "Nuevo idioma",
    fields: [["nombre", "Idioma"], ["nivel", "Nivel (MCER)", "cefr"]] }
};

function fieldHTML(id, label, value, kind) {
  if (kind === "area") return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}">${esc(value)}</textarea></div>`;
  if (kind === "range") return `<div class="field"><label for="${id}">${label}</label><div class="range-wrap"><input type="range" min="10" max="100" step="5" id="${id}" value="${esc(value)}"><output for="${id}">${esc(value)}%</output></div></div>`;
  if (kind === "cefr") return `<div class="field"><label for="${id}">${label}</label><select id="${id}">${[...CEFR, "Nativo"].map(l => `<option${l === value ? " selected" : ""}>${l}</option>`).join("")}</select></div>`;
  return `<div class="field"><label for="${id}">${label}</label><input id="${id}" value="${esc(value)}"></div>`;
}

function listHTML(key) {
  const L = LISTS[key];
  const items = data[key].map((it, i) => {
    const halves = L.fields.filter(f => f[2] === "half");
    let body = "";
    L.fields.forEach(f => {
      if (f[2] === "half") { if (f === halves[0]) body += `<div class="row">${halves.map(h => fieldHTML(`${key}-${i}-${h[0]}`, h[1], it[h[0]], "")).join("")}</div>`; }
      else body += fieldHTML(`${key}-${i}-${f[0]}`, f[1], it[f[0]], f[2]);
    });
    return `<div class="item" data-list="${key}" data-i="${i}">
      <div class="item-head"><strong>${esc(L.title(it))}</strong>
        <div class="mini">
          <button type="button" data-act="up" aria-label="Subir"${i === 0 ? " disabled" : ""}>↑</button>
          <button type="button" data-act="down" aria-label="Bajar"${i === data[key].length - 1 ? " disabled" : ""}>↓</button>
          <button type="button" data-act="del" class="del" aria-label="Eliminar">✕</button>
        </div></div>${body}</div>`;
  }).join("");
  return items + `<button type="button" class="btn add" data-act="add" data-list="${key}">+ ${L.add}</button>`;
}

function renderForm() {
  const open = [...document.querySelectorAll("details.sec")].map(d => d.open);
  const isOpen = (i, def) => (open.length ? open[i] : def) ? " open" : "";
  const initials = (data.nombre || "?").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  $("#form").innerHTML = `
    ${data._ejemplo ? `<div class="notice"><span>Estos son <b>datos de ejemplo</b>. Reemplázalos con los tuyos.</span><button class="btn" id="btn-clear2">Vaciar</button></div>` : ""}
    <details class="sec"${isOpen(0, true)}><summary>Datos personales</summary><div class="sec-body">
      <div class="photo-row">
        <div class="photo-thumb" style="${data.foto ? `background-image:url(${data.foto})` : ""}">${data.foto ? "" : esc(initials)}</div>
        <div class="field" style="flex:1"><label for="foto">Foto (opcional)</label><input type="file" id="foto" accept="image/*"></div>
        ${data.foto ? `<div class="mini"><button type="button" class="del" id="foto-del" aria-label="Quitar foto">✕</button></div>` : ""}
      </div>
      ${fieldHTML("nombre", "Nombre completo", data.nombre)}
      ${fieldHTML("cargo", "Cargo o profesión", data.cargo)}
      <div class="row">${fieldHTML("email", "Correo", data.email)}${fieldHTML("telefono", "Teléfono", data.telefono)}</div>
      <div class="row">${fieldHTML("ubicacion", "Ciudad", data.ubicacion)}${fieldHTML("web", "Web o LinkedIn", data.web)}</div>
    </div></details>
    <details class="sec"${isOpen(1, true)}><summary>Perfil profesional</summary><div class="sec-body">
      ${fieldHTML("resumen", "Resumen en 2–4 líneas", data.resumen, "area")}
    </div></details>
    ${Object.keys(LISTS).map((k, j) => `<details class="sec"${isOpen(2 + j, false)}><summary>${LISTS[k].label}</summary><div class="sec-body">${listHTML(k)}${k === "habilidades" ? fieldHTML("herramientas", "Otras herramientas (separadas por comas)", data.herramientas) : ""}</div></details>`).join("")}
    <details class="sec"${isOpen(2 + Object.keys(LISTS).length, false)}><summary>Diseño</summary><div class="sec-body">
      <div class="field"><label>Color de acento</label><div class="swatches">${ACCENTS.map(([n, c]) => `<button type="button" class="swatch" style="--c:${c}" data-accent="${c}" aria-label="${n}" aria-pressed="${data.acento === c}"></button>`).join("")}</div></div>
      <div class="field"><label>Distribución</label><div class="seg">
        <button type="button" data-layout="two" aria-pressed="${data.disposicion !== "single"}">Dos columnas</button>
        <button type="button" data-layout="single" aria-pressed="${data.disposicion === "single"}">Una columna</button>
      </div></div>
    </div></details>`;
}

function markEdited() { if (data._ejemplo) { delete data._ejemplo; const n = $(".notice"); if (n) n.remove(); } }

$("#form").addEventListener("input", e => {
  const el = e.target; if (!el.id || el.type === "file") return;
  const m = el.id.match(/^(\w+)-(\d+)-(\w+)$/);
  if (m) {
    const val = el.type === "range" ? +el.value : el.value;
    data[m[1]][+m[2]][m[3]] = val;
    if (el.type === "range") el.nextElementSibling.textContent = val + "%";
    const head = el.closest(".item").querySelector("strong"); head.textContent = LISTS[m[1]].title(data[m[1]][+m[2]]);
  } else if (el.id in data || el.id in BLANK) data[el.id] = el.value;
  markEdited(); renderCV(false); save();
});
$("#form").addEventListener("change", e => {
  if (e.target.id !== "foto" || !e.target.files[0]) return;
  const f = e.target.files[0];
  const img = new Image(), rd = new FileReader();
  rd.onload = () => { img.src = rd.result; };
  img.onload = () => {
    const s = 400, c = document.createElement("canvas"); c.width = c.height = s;
    const k = Math.max(s / img.width, s / img.height), w = img.width * k, h = img.height * k;
    c.getContext("2d").drawImage(img, (s - w) / 2, (s - h) / 2, w, h);
    data.foto = c.toDataURL("image/jpeg", .85); markEdited(); renderForm(); renderCV(true); save();
  };
  rd.readAsDataURL(f);
});
$("#form").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "btn-clear2") return clearAll();
  if (b.id === "foto-del") { data.foto = ""; renderForm(); renderCV(false); save(); return; }
  if (b.dataset.accent) { data.acento = b.dataset.accent; markEdited(); renderForm(); renderCV(false); save(); return; }
  if (b.dataset.layout) { data.disposicion = b.dataset.layout; markEdited(); renderForm(); renderCV(true); save(); return; }
  const act = b.dataset.act; if (!act) return;
  const item = b.closest(".item"), key = b.dataset.list || item?.dataset.list, i = item ? +item.dataset.i : -1, arr = data[key];
  if (act === "add") arr.push(clone(LISTS[key].blank));
  if (act === "del") arr.splice(i, 1);
  if (act === "up" && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
  if (act === "down" && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
  markEdited(); renderForm(); renderCV(false); save();
  if (act === "add") { const last = [...document.querySelectorAll(`.item[data-list="${key}"]`)].pop(); last?.querySelector("input,textarea")?.focus(); }
});

/* ---------------- CV preview ---------------- */
function dateRange(a, b) { a = (a || "").trim(); b = (b || "").trim(); return a && b && a !== b ? `${esc(a)} — ${esc(b)}` : esc(a || b); }

function renderCV(animate) {
  const d = data, sheet = $("#sheet");
  sheet.style.setProperty("--cv", d.acento || "#f26b1d");
  sheet.dataset.layout = d.disposicion || "two";
  const initials = (d.nombre || "").split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
  const nameChars = (d.nombre || "Tu nombre").split(/\s+/).filter(Boolean)
    .map((w, i, all) => `<span style="display:inline-block;white-space:nowrap${all.length > 1 && i >= Math.ceil(all.length / 2) ? ";color:var(--cv)" : ""}">${[...w].map(c => `<span class="ch">${esc(c)}</span>`).join("")}</span>`).join(" ");
  const contact = [["MAIL", d.email], ["TEL", d.telefono], ["LOC", d.ubicacion], ["WEB", d.web]].filter(x => x[1]?.trim())
    .map(([k, v]) => `<span><i>${k}</i>${esc(v)}</span>`).join("");
  const exp = d.experiencia.filter(x => x.cargo || x.empresa || x.descripcion);
  const edu = d.educacion.filter(x => x.titulo || x.institucion);
  const sk = d.habilidades.filter(x => x.nombre);
  const tools = (d.herramientas || "").split(",").map(s => s.trim()).filter(Boolean);
  const lg = d.idiomas.filter(x => x.nombre);
  const comp = (d.competencias || []).filter(x => x.categoria || x.items);
  const certs = (d.certificaciones || []).filter(x => x.nombre);
  const bullets = t => { const ls = String(t).split("\n").map(s => s.trim()).filter(Boolean); return ls.length > 1 ? `<ul class="tl-list">${ls.map(l => `<li>${esc(l)}</li>`).join("")}</ul>` : `<p class="tl-desc">${esc(ls[0] || "")}</p>`; };
  const cefrRow = lvl => { const n = lvl === "Nativo" ? 6 : CEFR.indexOf(lvl) + 1; return `<span class="cefr" aria-label="Nivel ${esc(lvl)}">${CEFR.map((l, i) => `<span class="${i < n ? "on" : ""}">${lvl === "Nativo" && i === 5 ? "NAT" : l}</span>`).join("")}</span>`; };

  const sideHTML = `
    ${comp.length ? `<section class="cv-sec" data-anim="sec"><h3>Competencias</h3><div class="comp">${comp.map(c => `<div class="comp-group"><div class="comp-title">${esc(c.categoria)}</div><div class="chips">${String(c.items || "").split(",").map(t => t.trim()).filter(Boolean).map(t => `<span data-anim="chip">${esc(t)}</span>`).join("")}</div></div>`).join("")}</div></section>` : ""}
    ${sk.length || tools.length ? `<section class="cv-sec" data-anim="sec"><h3>Habilidades</h3>
      <div class="skills">${sk.map(s => `<div class="skill"><div class="skill-top"><span>${esc(s.nombre)}</span><span>${s.nivel}%</span></div><div class="bar"><b style="width:${s.nivel}%" data-anim="bar"></b></div></div>`).join("")}</div>
      ${tools.length ? `<div class="chips" style="margin-top:14px">${tools.map(t => `<span data-anim="chip">${esc(t)}</span>`).join("")}</div>` : ""}
    </section>` : ""}
    ${lg.length ? `<section class="cv-sec" data-anim="sec"><h3>Idiomas</h3><div class="langs">${lg.map(l => `<div class="lang"><span>${esc(l.nombre)}</span>${cefrRow(l.nivel)}</div>`).join("")}</div></section>` : ""}
    ${certs.length ? `<section class="cv-sec" data-anim="sec"><h3>Certificaciones</h3><div class="edu">${certs.map(c => `<div class="edu-item" data-anim="item"><div class="tl-title">${esc(c.nombre)}</div><div class="tl-date">${esc(c.detalle)}</div></div>`).join("")}</div></section>` : ""}
    ${edu.length ? `<section class="cv-sec" data-anim="sec"><h3>Educación</h3><div class="edu">${edu.map(e => `<div class="edu-item" data-anim="item"><div class="tl-title">${esc(e.titulo)}</div><div class="tl-org">${esc(e.institucion)}</div><div class="tl-date">${dateRange(e.inicio, e.fin)}</div></div>`).join("")}</div></section>` : ""}`;

  sheet.innerHTML = `<div class="cv">
    <header class="cv-head${d.foto || initials ? "" : " no-photo"}">
      <div class="cv-photo${d.foto || initials ? "" : " hidden-photo"}" data-anim="photo" style="${d.foto ? `background-image:url(${d.foto})` : ""}">${d.foto ? "" : esc(initials)}</div>
      <div style="min-width:0">
        <h2 class="cv-name" aria-label="${esc(d.nombre)}">${nameChars}</h2>
        ${d.cargo ? `<p class="cv-role" data-anim="fade">${esc(d.cargo)}</p>` : ""}
        ${contact ? `<div class="cv-contact" data-anim="fade">${contact}</div>` : ""}
      </div>
    </header>
    <div class="cv-grid">
      <div class="cv-main">
        <section class="cv-sec" data-anim="sec"><h3>Perfil</h3>${d.resumen ? `<p class="cv-summary">${esc(d.resumen)}</p>` : `<p class="empty">Escribe un resumen de tu perfil.</p>`}</section>
        <section class="cv-sec" data-anim="sec"><h3>Experiencia</h3>
          ${exp.length ? `<div class="timeline" data-anim="line">${exp.map(x => `<div class="tl-item" data-anim="item">
            <div class="tl-top"><span class="tl-title">${esc(x.cargo)}</span><span class="tl-date">${dateRange(x.inicio, x.fin)}</span></div>
            <div class="tl-org">${esc(x.empresa)}</div>${x.descripcion ? bullets(x.descripcion) : ""}</div>`).join("")}</div>` : `<p class="empty">Añade tu experiencia laboral.</p>`}
        </section>
      </div>
      <div class="cv-side">${sideHTML}</div>
    </div>
  </div>`;
  if (animate) play();
}

/* ---------------- Motion ---------------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
function play() {
  if (reduce || !Element.prototype.animate) return;
  const s = $("#sheet"), E = "cubic-bezier(.2,.8,.2,1)";
  s.getAnimations({ subtree: true }).forEach(a => a.cancel());
  s.animate([{ opacity: 0, transform: "translateY(24px) scale(.985)" }, { opacity: 1, transform: "none" }], { duration: 700, easing: E });
  s.querySelectorAll('[data-anim="photo"]').forEach(el => el.animate(
    [{ transform: "scale(.4) rotate(-20deg)", opacity: 0 }, { transform: "scale(1.06)", opacity: 1, offset: .7 }, { transform: "none", opacity: 1 }],
    { duration: 900, delay: 150, easing: E, fill: "backwards" }));
  s.querySelectorAll(".cv-name .ch").forEach((el, i) => el.animate(
    [{ transform: "translateY(110%) rotate(8deg)", opacity: 0, filter: "blur(6px)" }, { transform: "none", opacity: 1, filter: "blur(0)" }],
    { duration: 650, delay: 250 + i * 28, easing: E, fill: "backwards" }));
  const base = 450 + Math.min(s.querySelectorAll(".cv-name .ch").length, 30) * 28;
  s.querySelectorAll('[data-anim="fade"]').forEach((el, i) => el.animate(
    [{ opacity: 0, transform: "translateX(-12px)" }, { opacity: 1, transform: "none" }], { duration: 600, delay: base + i * 120, easing: E, fill: "backwards" }));
  s.querySelectorAll('[data-anim="sec"]').forEach((el, i) => {
    const d = base + 250 + i * 140;
    el.animate([{ opacity: 0, transform: "translateY(16px)" }, { opacity: 1, transform: "none" }], { duration: 650, delay: d, easing: E, fill: "backwards" });
    const h = el.querySelector("h3"); if (h) h.animate([{ transform: "translateY(10px)", opacity: 0 }, { transform: "none", opacity: 1 }], { duration: 800, delay: d, easing: E, fill: "backwards" });
    el.querySelectorAll('[data-anim="item"]').forEach((it, j) => it.animate(
      [{ opacity: 0, transform: "translateX(-14px)" }, { opacity: 1, transform: "none" }], { duration: 550, delay: d + 200 + j * 130, easing: E, fill: "backwards" }));
    el.querySelectorAll('[data-anim="bar"]').forEach((b, j) => b.animate(
      [{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: 1100, delay: d + 200 + j * 110, easing: "cubic-bezier(.65,0,.2,1)", fill: "backwards" }));
    el.querySelectorAll('[data-anim="chip"]').forEach((c, j) => c.animate(
      [{ opacity: 0, transform: "scale(.6)" }, { opacity: 1, transform: "none" }], { duration: 400, delay: d + 500 + j * 60, easing: E, fill: "backwards" }));
    el.querySelectorAll(".cefr span.on").forEach((c, j) => c.animate(
      [{ opacity: .15 }, { opacity: 1 }], { duration: 300, delay: d + 200 + j * 50, fill: "backwards" }));
  });
}

/* ambient background: drifting soft light, tinted by the accent */
(function ambient() {
  const c = $("#ambient"), ctx = c.getContext("2d");
  let w, h, t = 0;
  const blobs = [0, 1, 2].map(i => ({ x: Math.random(), y: Math.random(), r: .35 + i * .1, sx: .00007 + i * .00004, sy: .00009 + i * .00003, p: i * 2 }));
  const size = () => { const dpr = Math.min(devicePixelRatio || 1, 2); w = c.width = innerWidth * dpr; h = c.height = innerHeight * dpr; };
  size(); addEventListener("resize", size);
  function frame() {
    ctx.clearRect(0, 0, w, h);
    const col = data.acento || "#f26b1d";
    blobs.forEach((b, i) => {
      const x = (0.5 + 0.45 * Math.sin(t * b.sx * 60 + b.p)) * w, y = (0.5 + 0.45 * Math.cos(t * b.sy * 60 + b.p * 1.3)) * h, r = b.r * Math.max(w, h);
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, col + (i === 0 ? "18" : "0e")); g.addColorStop(1, col + "00");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    });
    t++; if (!reduce) requestAnimationFrame(frame);
  }
  frame();
})();

/* ---------------- Vista ATS (#cv) ---------------- */
const ATS_UI = {
  es: { home: "Ver portafolio", hint: "En el cuadro de impresión elige «Guardar como PDF».", print: "Descargar PDF", full: "Completo", short: "Resumido", version: "Versión", toolbar: "Opciones de la hoja de vida" },
  en: { home: "View portfolio", hint: "In the print dialog choose “Save as PDF”.", print: "Download PDF", full: "Full", short: "Short", version: "Version", toolbar: "Résumé options" }
};
function atsHTML(lang, version) {
  const L = D.labels[lang], t = o => esc(o[lang]), short = version === "resumen";
  const c = D.contact;
  const job = e => {
    const bullets = short ? e.short.map(i => e.bullets[i]) : e.bullets;
    return `<article class="ats-job">
      <h3>${t(e.role)} — ${esc(e.org)}</h3>
      <p class="ats-meta">${t(e.start)} – ${t(e.end)}${e.product ? ` · <b>${esc(L.productRole)}</b>` : ""}</p>
      <ul>${bullets.map(b => `<li>${t(b)}</li>`).join("")}</ul>
      ${e.stack && !short ? `<p class="ats-stack">Stack: ${esc(e.stack)}</p>` : ""}
    </article>`;
  };
  const pro = D.experience.filter(e => e.kind === "pro"), doc = D.experience.filter(e => e.kind === "doc");
  // en la versión resumida, los cargos anteriores a 2022 van en una línea cada uno
  const recent = short ? pro.filter(e => +e.start.es.slice(-4) >= 2022) : pro;
  const earlier = short ? pro.filter(e => +e.start.es.slice(-4) < 2022) : [];
  return `
    <header class="ats-head">
      <h1>${esc(D.name)}</h1>
      <p class="ats-role">${t(D.role)} · ${t(D.degree)}</p>
      <ul class="ats-contact" aria-label="${esc(L.contact)}">
        <li><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></li>
        <li>${esc(c.phone)}</li>
        <li>${esc(c.location)}</li>
        <li><a href="${esc(c.linkedinUrl)}">${esc(c.linkedin)}</a></li>
      </ul>
    </header>
    <section class="ats-keep"><h2>${esc(L.profile)}</h2><p>${t(short ? D.profileShort : D.profile)}</p></section>
    ${short ? "" : `<section class="ats-keep"><h2>${esc(L.summary)}</h2><ul class="ats-plain">${D.summary.map(s => `<li><strong>${t(s.label)}:</strong> ${t(s.value)}. ${t(s.text)}</li>`).join("")}</ul></section>`}
    <section class="ats-keep"><h2>${esc(L.skills)}</h2><ul class="ats-plain">${D.skills.map(g => `<li><strong>${t(g.group)}:</strong> ${esc(g.items[lang].join(", "))}</li>`).join("")}</ul></section>
    <section><h2>${esc(L.experience)}</h2>${recent.map(job).join("")}
      ${earlier.length ? `<h3 style="margin-top:10px">${esc(L.earlier)}</h3><ul class="ats-earlier">${earlier.map(e => `<li><strong>${t(e.role)}</strong> — ${esc(e.org)} (${t(e.start)} – ${t(e.end)})</li>`).join("")}</ul>` : ""}
    </section>
    <section><h2>${esc(L.teaching)}</h2>${doc.map(job).join("")}</section>
    <section class="ats-keep"><h2>${esc(L.education)}</h2><ul class="ats-plain">${D.education.map(x => `<li><strong>${t(x.title)}</strong> — ${esc(x.school)} (${t(x.year)})</li>`).join("")}</ul></section>
    <section class="ats-keep"><h2>${esc(L.certifications)}</h2>${short
      ? `<ul class="ats-plain">${D.certifications.map(g => `<li><strong>${t(g.group)}:</strong> ${g.items.map(i => `${t(i.name)} (${[i.issuer, i.year].filter(Boolean).map(esc).join(", ")})`).join("; ")}</li>`).join("")}</ul>`
      : D.certifications.map(g => `<p class="ats-cert-group">${t(g.group)}</p><ul>${g.items.map(i => `<li>${t(i.name)} — ${[i.issuer, i.year].filter(Boolean).map(esc).join(", ")}</li>`).join("")}</ul>`).join("")}</section>
    <section class="ats-keep"><h2>${esc(L.languages)}</h2>${short
      ? `<p>${D.languages.map(t).join(" · ")}</p>`
      : `<ul class="ats-plain">${D.languages.map(l => `<li>${t(l)}</li>`).join("")}</ul>`}</section>`;
}
function startATS() {
  const q = new URLSearchParams(location.search);
  let lang = q.get("lang");
  if (lang !== "es" && lang !== "en") { try { lang = localStorage.getItem("am-lang"); } catch {} }
  if (lang !== "es" && lang !== "en") lang = (navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en";
  let version = q.get("version") === "resumen" ? "resumen" : "completo";
  document.body.classList.add("ats-mode");
  $("#app").hidden = true;
  const view = $("#ats-view"); view.hidden = false;
  const render = () => {
    const U = ATS_UI[lang];
    document.documentElement.lang = lang;
    $("#ats-doc").innerHTML = atsHTML(lang, version);
    // el título define el nombre sugerido del PDF
    document.title = `Armando-Medina-CV-${lang.toUpperCase()}-${version === "resumen" ? (lang === "en" ? "short" : "resumido") : (lang === "en" ? "full" : "completo")}`;
    $("#ats-home-label").textContent = U.home;
    $("#ats-home").href = lang === "en" ? "/en/" : "/";
    $("#ats-hint").textContent = U.hint;
    $("#ats-print").textContent = U.print;
    view.querySelector(".ats-bar").setAttribute("aria-label", U.toolbar);
    $("#ats-version").setAttribute("aria-label", U.version);
    $("#ats-version [data-version=completo]").textContent = U.full;
    $("#ats-version [data-version=resumen]").textContent = U.short;
    view.querySelectorAll("#ats-lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
    view.querySelectorAll("#ats-version button").forEach(b => b.setAttribute("aria-pressed", b.dataset.version === version));
    try { history.replaceState(null, "", `?lang=${lang}&version=${version}#cv`); } catch {}
  };
  $("#ats-lang").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { lang = b.dataset.lang; try { localStorage.setItem("am-lang", lang); } catch {} render(); } });
  $("#ats-version").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { version = b.dataset.version; render(); } });
  $("#ats-print").addEventListener("click", () => window.print());
  render();
  // «Descargar CV en PDF» desde el portafolio abre el diálogo de impresión al cargar
  if (q.get("print") === "1") (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => setTimeout(() => window.print(), 300));
}

if (location.hash === "#cv") { startATS(); return; }
renderForm();
renderCV(true);
})();
</script>
